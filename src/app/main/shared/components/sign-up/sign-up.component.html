<div class="sign-up__container">
  <cfr-input [data]="emailInputConfig"></cfr-input>
  <cfr-input [data]="passwordInputConfig"></cfr-input>
  <div class="sign-up__button--continue">
    <cfr-button [buttonText]="buttonContinueText"></cfr-button>
  </div>
  <div class="sign-up__link">
    <cfr-link [buttonText]="linkRemindPasswordText"></cfr-link>
  </div>
  <cfr-link [buttonText]="linkLoginPhoneText"></cfr-link>
  <cfr-link [buttonText]="linkRemindPasswordText" [size]="remindPasswordSize"></cfr-link>
  <!-- <cfr-checkbox></cfr-checkbox> -->
  <cfr-checkbox [position]="checkboxPosition"></cfr-checkbox>
  <!-- <cfr-input [data]="phoneInputConfig"></cfr-input> -->
</div>
